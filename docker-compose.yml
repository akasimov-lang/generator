version: "2.4"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: generator-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_SKIP_DB_INIT: "true"
    cpu_shares: 2048
    mem_limit: 1536m
    command: sh -c "python -c 'from app.db import init_db; init_db()' && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  celery_worker:
    image: generator-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
    cpus: 1.5
    cpu_shares: 256
    mem_limit: 2g
    stop_grace_period: 120s
    command: celery -A app.worker.celery_app worker --loglevel=info --hostname=generation@%h --queues=generation,celery --concurrency=2

  menu_check_worker:
    image: generator-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
    cpus: 0.75
    cpu_shares: 256
    mem_limit: 1536m
    stop_grace_period: 120s
    command: celery -A app.worker.celery_app worker --loglevel=info --hostname=menu@%h --queues=menu_checks --concurrency=1

  publication_worker:
    image: generator-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.75
    cpu_shares: 256
    mem_limit: 768m
    stop_grace_period: 120s
    command: celery -A app.worker.celery_app worker --loglevel=info --hostname=publication@%h --queues=publication --concurrency=1

  automation_worker:
    image: generator-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.75
    cpu_shares: 256
    mem_limit: 768m
    stop_grace_period: 120s
    command: celery -A app.worker.celery_app worker --loglevel=info --hostname=automation@%h --queues=automation --concurrency=1

  confirmation_worker:
    image: generator-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.5
    cpu_shares: 256
    mem_limit: 512m
    stop_grace_period: 120s
    command: celery -A app.worker.celery_app worker --loglevel=info --hostname=confirmation@%h --queues=confirmation --concurrency=1

  cache_worker:
    image: generator-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.5
    cpu_shares: 256
    mem_limit: 768m
    stop_grace_period: 120s
    command: celery -A app.worker.celery_app worker --loglevel=info --hostname=cache_sync@%h --queues=cache_sync --concurrency=1

  maintenance_worker:
    image: generator-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.25
    cpu_shares: 256
    mem_limit: 384m
    stop_grace_period: 120s
    command: celery -A app.worker.celery_app worker --loglevel=info --hostname=maintenance@%h --queues=maintenance --concurrency=1

  celery_beat:
    image: generator-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app beat --loglevel=info

  project_stream:
    image: generator-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m app.project_stream

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  redis_data:
