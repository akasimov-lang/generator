# Реальные адреса посетителей принимаются только от сетей Cloudflare.
# Источники: https://www.cloudflare.com/ips-v4/ и https://www.cloudflare.com/ips-v6/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

server {
  listen 80;
  server_name ai-seo-content-panel.site www.ai-seo-content-panel.site;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://ai-seo-content-panel.site$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.ai-seo-content-panel.site;

  ssl_certificate /etc/letsencrypt/live/ai-seo-content-panel.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ai-seo-content-panel.site/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://ai-seo-content-panel.site$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ai-seo-content-panel.site;

  ssl_certificate /etc/letsencrypt/live/ai-seo-content-panel.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ai-seo-content-panel.site/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Общий VPN whitelist защищает интерфейс и API.
  include /etc/nginx/whitelists/whitelist_vpn.conf;
  deny all;

  client_max_body_size 10m;
  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_types application/javascript application/json text/css image/svg+xml;
  resolver 127.0.0.11 ipv6=off valid=30s;

  set $backend_upstream backend:8000;
  set $frontend_upstream frontend:80;

  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
