server {
  listen 80;
  server_name ai-seo-content-panel.site www.ai-seo-content-panel.site;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://ai-seo-content-panel.site$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.ai-seo-content-panel.site;

  ssl_certificate /etc/letsencrypt/live/ai-seo-content-panel.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ai-seo-content-panel.site/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://ai-seo-content-panel.site$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ai-seo-content-panel.site;

  ssl_certificate /etc/letsencrypt/live/ai-seo-content-panel.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ai-seo-content-panel.site/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 10m;
  resolver 127.0.0.11 ipv6=off valid=30s;

  set $backend_upstream backend:8000;
  set $frontend_upstream frontend:80;

  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
